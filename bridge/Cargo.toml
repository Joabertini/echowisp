[package]
name = "ytm-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
cpal = "0.16"
serde_json = "1"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "twilight", "rustls", "tws"] }
symphonia-core = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
twilight-gateway = "0.17"
twilight-model = "0.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
