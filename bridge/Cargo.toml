[package]
name = "echowisp-bridge"
version = "0.5.0"
edition = "2021"

[dependencies]
base64 = "0.22"
serde_json = "1"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "twilight", "rustls", "tws"] }
symphonia-core = "0.5"
# songbird sin features por defecto no registra el decodificador de PCM: la entrada cruda (f32)
# fallaba en silencio y el bot entraba al canal sin transmitir nada.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
twilight-gateway = "0.17"
twilight-model = "0.17"
# Bindings Win32 para process loopback y sesiones de audio.
windows = { version = "0.54", features = [
  "implement",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Para iterar (`cargo build --profile rapido`): sin LTO, incremental. Lo publicado usa release.
[profile.rapido]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
