[package]
name = "ytm-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
cpal = "0.16"
serde_json = "1"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "twilight", "rustls", "tws"] }
symphonia-core = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
twilight-gateway = "0.17"
twilight-model = "0.17"
# La misma version que ya trae cpal: no compila otra copia.
windows = { version = "0.54", features = [
  "implement",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
